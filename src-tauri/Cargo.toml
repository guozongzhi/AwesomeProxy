[package]
name = "awesomeproxy"
version = "0.1.0"
description = "Local-first AI gateway desktop app"
authors = ["AwesomeProxy Contributors"]
edition = "2021"

[lib]
name = "awesomeproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
